<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온톨로지 지식 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-gray-800 border-b border-gray-700 px-4 py-2 flex items-center justify-between shrink-0">
    <h1 class="text-lg font-bold text-blue-400">🧠 온톨로지 지식 시스템</h1>
    <div class="flex gap-2">
      <button onclick="showView('notes')" id="btn-notes" class="nav-btn active px-3 py-1 rounded text-sm">노트</button>
      <button onclick="showView('graph')" id="btn-graph" class="nav-btn px-3 py-1 rounded text-sm">그래프</button>
      <button onclick="showView('entities')" id="btn-entities" class="nav-btn px-3 py-1 rounded text-sm">엔티티</button>
      <button onclick="showView('questions')" id="btn-questions" class="nav-btn px-3 py-1 rounded text-sm">탐구 질문</button>
      <button onclick="showView('conflicts')" id="btn-conflicts" class="nav-btn px-3 py-1 rounded text-sm">모순 관리</button>
    </div>
    <div class="flex gap-2">
      <input type="text" id="search-input" placeholder="검색..."
             class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm w-48"
             onkeydown="if(event.key==='Enter') doSearch()">
      <button onclick="doSearch()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm">검색</button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="flex flex-1 overflow-hidden">

    <!-- 사이드바: 노트 목록 -->
    <aside id="sidebar" class="w-72 bg-gray-800 border-r border-gray-700 flex flex-col shrink-0">
      <div class="p-2 border-b border-gray-700 flex justify-between items-center">
        <span class="text-sm font-semibold text-gray-400">노트 목록</span>
        <button onclick="createNewNote()" class="bg-green-600 hover:bg-green-700 px-2 py-1 rounded text-xs">+ 새 노트</button>
      </div>
      <div id="note-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- 동적 생성 -->
      </div>
    </aside>

    <!-- 콘텐츠 영역 -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- 노트 뷰 -->
      <div id="view-notes" class="view flex-1 flex flex-col overflow-hidden">
        <div class="flex border-b border-gray-700 shrink-0">
          <button onclick="setEditorMode('edit')" id="btn-edit" class="tab-btn active px-4 py-2 text-sm">편집</button>
          <button onclick="setEditorMode('preview')" id="btn-preview" class="tab-btn px-4 py-2 text-sm">미리보기</button>
          <div class="flex-1"></div>
          <button onclick="saveCurrentNote()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm m-1 rounded">저장</button>
          <button onclick="deleteCurrentNote()" class="bg-red-600 hover:bg-red-700 px-3 py-2 text-sm m-1 rounded">삭제</button>
        </div>
        <div id="editor-area" class="flex-1 overflow-hidden">
          <textarea id="markdown-editor"
                    class="w-full h-full bg-gray-900 text-gray-100 p-4 font-mono text-sm resize-none outline-none"
                    placeholder="마크다운으로 노트를 작성하세요..."></textarea>
        </div>
        <div id="preview-area" class="flex-1 overflow-y-auto p-4 hidden">
          <div id="preview-content" class="prose prose-invert max-w-none"></div>
        </div>
      </div>

      <!-- 그래프 뷰 -->
      <div id="view-graph" class="view flex-1 hidden">
        <div id="graph-container" class="w-full h-full"></div>
      </div>

      <!-- 엔티티 뷰 -->
      <div id="view-entities" class="view flex-1 overflow-y-auto hidden">
        <div id="entities-content" class="p-4 space-y-3"></div>
      </div>

      <!-- 질문 뷰 -->
      <div id="view-questions" class="view flex-1 overflow-y-auto hidden">
        <div class="p-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold">미해결 탐구 질문</h2>
            <button onclick="generateNewQuestions()" class="bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm">
              AI 질문 생성
            </button>
          </div>
          <div id="questions-content" class="space-y-3"></div>
        </div>
      </div>

      <!-- 모순 관리 뷰 -->
      <div id="view-conflicts" class="view flex-1 overflow-y-auto hidden">
        <div class="p-4">
          <h2 class="text-lg font-bold mb-4">모순 관리 (병렬 보존된 주장)</h2>
          <div id="conflicts-content" class="space-y-4"></div>
        </div>
      </div>

      <!-- 검색 결과 -->
      <div id="view-search" class="view flex-1 overflow-y-auto hidden">
        <div id="search-results" class="p-4 space-y-3"></div>
      </div>

    </div>
  </main>

  <!-- 상태바 -->
  <footer class="bg-gray-800 border-t border-gray-700 px-4 py-1 text-xs text-gray-500 flex justify-between shrink-0">
    <span id="status-text">준비됨</span>
    <span id="stats-text">-</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
